<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avondroutine</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Onderhoud">
<meta name="theme-color" content="#2F6D5B">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{
    --mist:#E7ECEC; --paper:#F4F6F5; --card:#FBFCFC; --ink:#16241F; --stone:#5F726F;
    --line:#D3DBD9; --spruce:#2F6D5B; --spruce-soft:#DCEAE4; --amber:#D98A2B; --amber-soft:#F6E6CE;
    --shadow:0 1px 2px rgba(22,36,31,.06),0 6px 16px rgba(22,36,31,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--mist);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;padding:calc(18px + env(safe-area-inset-top)) 14px 60px}
  .wrap{max-width:560px;margin:0 auto}
  .mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

  header{display:flex;align-items:center;gap:11px;margin:2px 2px 16px}
  .peak{flex:0 0 auto}
  .eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--stone)}
  h1{font-size:22px;line-height:1.1;margin:2px 0 0;letter-spacing:-.01em}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 12px;box-shadow:var(--shadow);text-align:center}
  .tile .v{font-family:ui-monospace,Menlo,monospace;font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .tile .v small{font-size:13px;color:var(--stone)}
  .tile .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--stone);margin-top:6px}
  .tile.streak .v{color:var(--amber)}
  .tile.streak.cold .v{color:var(--stone)}

  .progress{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px}
  .progress .row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--stone);margin-bottom:8px}
  .progress .row b{color:var(--ink);font-size:13px}
  .track{height:8px;background:var(--mist);border-radius:6px;overflow:hidden}
  .fill{height:100%;background:var(--spruce);border-radius:6px;transition:width .3s}
  .hint{font-size:11.5px;color:var(--stone);margin-top:9px}
  .joker{font-size:12px;color:var(--stone);margin:10px 2px 20px;display:flex;align-items:center;gap:7px}
  .jdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .jdot.on{background:var(--spruce)} .jdot.off{background:var(--line)}

  .tonight{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
  .tonight.done{border-color:var(--spruce);box-shadow:0 0 0 2px var(--spruce-soft),var(--shadow)}
  .th{padding:15px 16px 4px}
  .th .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);display:flex;align-items:center;gap:8px}
  .daytag{background:var(--spruce-soft);color:var(--spruce);border-radius:6px;padding:1px 6px;font-weight:700;letter-spacing:.05em}
  .th .lvl{font-size:18px;font-weight:600;margin-top:3px}
  .th .nx{font-size:12px;color:var(--stone);margin-top:2px}
  .celebrate{margin:14px 16px;padding:14px;border-radius:12px;background:var(--spruce-soft);text-align:center}
  .celebrate .big{font-size:16px;font-weight:700;color:var(--spruce)}
  .celebrate .sm{font-size:13px;color:var(--ink);margin-top:4px}
  .gained{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .gained span{font-size:12px;background:#fff;border:1px solid var(--spruce);color:var(--spruce);border-radius:20px;padding:2px 9px;font-weight:600}

  .exlist{padding:4px 16px 8px}
  .ex{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
  .ex:first-child{border-top:none}
  .cb{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;margin-top:1px;transition:.12s}
  .cb.on{background:var(--spruce);border-color:var(--spruce)}
  .cb svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
  .cb.on svg{opacity:1}
  .cb.lock{opacity:.7;cursor:default}
  .ex-txt{flex:1 1 auto;min-width:0}
  .ex-head{display:flex;align-items:center;gap:8px;cursor:pointer}
  .ex-name{font-size:15px;font-weight:600}
  .ex-name .rep{font-family:ui-monospace,Menlo,monospace;color:var(--spruce);font-weight:700;margin-left:4px}
  .ex.done .ex-name{text-decoration:line-through;text-decoration-color:var(--stone);color:var(--stone)}
  .i{flex:0 0 auto;width:19px;height:19px;border-radius:50%;border:1.5px solid var(--stone);color:var(--stone);background:none;font-size:11px;font-style:italic;font-weight:700;font-family:Georgia,serif;cursor:pointer;display:grid;place-items:center;padding:0;margin-left:auto}
  .i.open{background:var(--stone);color:#fff}
  .ex-easy{font-size:12px;color:var(--amber);margin-top:2px}
  .ex-note{font-size:12.5px;color:var(--stone);margin-top:1px}
  .ex-info{font-size:12.5px;line-height:1.5;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:8px}

  .lvlctl{display:flex;gap:8px;padding:2px 16px 16px}
  .lvlctl button{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12.5px;color:var(--stone);cursor:pointer}
  .lvlctl button:active{background:var(--mist)}

  .ach h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);margin:22px 2px 10px}
  .badges{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .badge{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
  .badge.lk{opacity:.5}
  .badge .em{font-size:20px;flex:0 0 auto;filter:grayscale(1)}
  .badge.un .em{filter:none}
  .badge .bt{font-size:13px;font-weight:600;line-height:1.2}
  .badge .bs{font-size:11px;color:var(--stone);margin-top:1px}

  footer{text-align:center;color:var(--stone);font-size:12px;margin-top:24px;line-height:1.6}
  .reset{background:none;border:none;color:var(--stone);font-size:12px;text-decoration:underline;cursor:pointer;margin-top:8px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <img class="peak" src="icon.png" width="34" height="34" alt="" style="border-radius:8px;display:block">
    <div>
      <div class="eyebrow">Elke avond · ~10 min</div>
      <h1>Full body onderhoud</h1>
    </div>
  </header>

  <div class="stats">
    <div class="tile streak" id="t-streak"><div class="v" id="v-streak">0</div><div class="k">reeks</div></div>
    <div class="tile"><div class="v" id="v-level">1<small>/6</small></div><div class="k">niveau</div></div>
    <div class="tile"><div class="v" id="v-total">0</div><div class="k">sessies</div></div>
  </div>

  <div class="progress" id="prog"></div>
  <div class="joker" id="joker"></div>

  <div id="tonight"></div>

  <div class="ach">
    <h2>Achievements</h2>
    <div class="badges" id="badges"></div>
  </div>

  <footer>
    Normale spiervermoeidheid hoort erbij. Scherpe pijn = stoppen.<br>
    <button class="reset" id="reset">alles resetten</button>
  </footer>
</div>

<script>
/* ---------- PWA manifest (voor zelf-hosten als lokale webapp) ---------- */
try{
  const mf={name:"Avondroutine",short_name:"Onderhoud",display:"standalone",
    background_color:"#E7ECEC",theme_color:"#2F6D5B",start_url:".",
    icons:[{src:"icon.png",sizes:"512x512",type:"image/png"}]};
  const url=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}));
  const l=document.createElement("link"); l.rel="manifest"; l.href=url; document.head.appendChild(l);
}catch(e){}

/* ---------- Oefening-uitleg ---------- */
const INFO={
  "Cat-cow":"Op handen en knieën. Wissel traag tussen holle rug (kijk omhoog) en bolle rug (kin naar de borst), mee op je adem. Losmaker voor de rug.",
  "Squats":"Voeten op heupbreedte. Zak alsof je op een stoel gaat zitten: heupen naar achter, knieën volgen de tenen, rug recht. Duw via je hielen weer omhoog.",
  "Split squats":"Sta in een schrede: één voet voor, één achter. Zak recht naar beneden tot de achterste knie bijna de grond raakt, duw via de voorste hiel omhoog. Reps per been. Steun eventueel met een hand.",
  "Wall push-ups":"Sta op armlengte van een muur, handen op schouderhoogte. Buig je armen om je borst naar de muur te laten zakken, duw terug. De makkelijkste push-up.",
  "Incline push-ups":"Handen op een verhoging (aanrecht, tafel, trap). Hoe hoger de steun, hoe makkelijker. Zak met je borst naar de rand, duw terug, lichaam recht.",
  "Knee push-ups":"Push-up steunend op je knieën i.p.v. je tenen. Handen iets breder dan schouders, lichaam recht van knie tot hoofd, zak en duw.",
  "Push-ups":"Volledige push-up op handen en tenen. Lichaam één rechte lijn, zak tot je borst bijna de grond raakt, duw terug. Span je buik aan.",
  "Glute bridge":"Op je rug, knieën gebogen, voeten plat. Duw je heupen omhoog tot schouder–heup–knie één lijn vormen door je billen aan te spannen. Gecontroleerd zakken.",
  "Single-leg glute bridge":"Glute bridge met één been gestrekt omhoog. Duw via de hiel van het steunende been je heup omhoog, bekken recht houden. Reps per been.",
  "Calf raises":"Duw je hielen zo hoog mogelijk omhoog tot je op je tenen staat, even vasthouden, traag zakken. Steun licht met een hand voor je evenwicht.",
  "Single-leg calf raises":"Calf raise op één been, het andere licht van de grond. Duw je hiel hoog op, traag zakken. Steun met een hand aan de muur. Reps per been.",
  "Bird dog":"Op handen en knieën. Strek tegelijk je ene arm naar voor en het tegenovergestelde been naar achter, in lijn met je rug. Even vasthouden, dan de andere kant.",
  "Dead bug":"Op je rug, armen recht omhoog, knieën in 90°. Laat traag je ene arm én het tegenovergestelde been zakken tot net boven de grond, terug, dan de andere kant. Onderrug tegen de vloer.",
  "Plank":"Steun op onderarmen en tenen, lichaam één rechte lijn van hoofd tot hielen. Span buik en billen aan, hol niet door. Op je knieën = makkelijker.",
  "Child's pose":"Kniel, zak met je zit naar je hielen en strek je armen naar voor op de grond. Laat rug en schouders ontspannen. Rustig ademen."
};

/* ---------- Progressie per oefening (moeilijker via variant/tempo, niet enkel meer reps) ---------- */
const MAX=6;
const EX={
  catcow:[{n:"Cat-cow",r:"6×"},{n:"Cat-cow",r:"8×"},{n:"Cat-cow",r:"8×"},{n:"Cat-cow",r:"8×"},{n:"Cat-cow",r:"8×"},{n:"Cat-cow",r:"8×"}],
  squat:[
    {n:"Squats",r:"8×",easy:"tot op een stoel zakken"},
    {n:"Squats",r:"10×"},
    {n:"Squats",r:"10×",note:"traag: 3 tellen zakken"},
    {n:"Squats",r:"12×",note:"traag: 3 tellen zakken"},
    {n:"Split squats",r:"8× p/been",easy:"steun met een hand"},
    {n:"Split squats",r:"10× p/been"},
  ],
  glute:[
    {n:"Glute bridge",r:"10×"},
    {n:"Glute bridge",r:"12×"},
    {n:"Glute bridge",r:"14×"},
    {n:"Single-leg glute bridge",r:"8× p/been"},
    {n:"Single-leg glute bridge",r:"10× p/been"},
    {n:"Single-leg glute bridge",r:"12× p/been"},
  ],
  calf:[
    {n:"Calf raises",r:"12×"},
    {n:"Calf raises",r:"15×"},
    {n:"Calf raises",r:"15×",note:"traag, 2 tellen boven"},
    {n:"Single-leg calf raises",r:"12× p/been"},
    {n:"Single-leg calf raises",r:"14× p/been"},
    {n:"Single-leg calf raises",r:"16× p/been"},
  ],
  push:[
    {n:"Wall push-ups",r:"8×"},
    {n:"Incline push-ups",r:"8×",easy:"hogere steun = makkelijker"},
    {n:"Incline push-ups",r:"10×"},
    {n:"Knee push-ups",r:"8×"},
    {n:"Knee push-ups",r:"10×"},
    {n:"Push-ups",r:"8×",easy:"op je knieën, 12×"},
  ],
  plank:[
    {n:"Plank",r:"15 sec",easy:"op je knieën"},
    {n:"Plank",r:"20 sec",easy:"op je knieën"},
    {n:"Plank",r:"30 sec"},
    {n:"Plank",r:"40 sec"},
    {n:"Plank",r:"45 sec"},
    {n:"Plank",r:"50 sec"},
  ],
  deadbug:[
    {n:"Dead bug",r:"6× p/kant"},
    {n:"Dead bug",r:"8× p/kant"},
    {n:"Dead bug",r:"10× p/kant"},
    {n:"Dead bug",r:"10× p/kant",note:"traag"},
    {n:"Dead bug",r:"12× p/kant",note:"traag"},
    {n:"Dead bug",r:"12× p/kant",note:"traag"},
  ],
  birddog:[
    {n:"Bird dog",r:"6× p/kant"},
    {n:"Bird dog",r:"8× p/kant"},
    {n:"Bird dog",r:"10× p/kant"},
    {n:"Bird dog",r:"10× p/kant",note:"even vasthouden"},
    {n:"Bird dog",r:"12× p/kant",note:"2 tellen vasthouden"},
    {n:"Bird dog",r:"12× p/kant",note:"2 tellen vasthouden"},
  ],
  childs:[{n:"Child's pose",r:"30 sec"},{n:"Child's pose",r:"30 sec"},{n:"Child's pose",r:"30 sec"},{n:"Child's pose",r:"30 sec"},{n:"Child's pose",r:"40 sec"},{n:"Child's pose",r:"40 sec"}],
};

/* A/B wisselt elke sessie */
const DAY_A={key:"A",name:"Onderlijf & core",seq:["catcow","squat","glute","calf","deadbug","birddog","childs"]};
const DAY_B={key:"B",name:"Bovenlijf & core",seq:["catcow","push","plank","birddog","glute","deadbug","childs"]};
function circuit(li,type){ const d=type==="A"?DAY_A:DAY_B; return d.seq.map(k=>EX[k][li]); }

const ACH=[
  {id:"s1",kind:"total",n:1,em:"🌱",name:"Van start",sub:"1e sessie"},
  {id:"s7",kind:"total",n:7,em:"📅",name:"Eerste week rond",sub:"7 sessies"},
  {id:"s21",kind:"total",n:21,em:"💪",name:"Drie weken",sub:"21 sessies"},
  {id:"s50",kind:"total",n:50,em:"🏅",name:"Vaste waarde",sub:"50 sessies"},
  {id:"s100",kind:"total",n:100,em:"🏆",name:"Honderd",sub:"100 sessies"},
  {id:"k3",kind:"streak",n:3,em:"🔥",name:"Op dreef",sub:"3 op rij"},
  {id:"k7",kind:"streak",n:7,em:"🔥",name:"Week op rij",sub:"7 op rij"},
  {id:"k14",kind:"streak",n:14,em:"🔥",name:"Twee weken strak",sub:"14 op rij"},
  {id:"k30",kind:"streak",n:30,em:"⚡",name:"IJzeren discipline",sub:"30 op rij"},
  {id:"lvl",kind:"max",n:6,em:"⛰️",name:"Onderhoudsmodus",sub:"niveau 6 bereikt"},
];

/* ---------- State ---------- */
const KEY="onderhoud:v1";
let state={total:0,streak:0,best:0,last:null,jokerWeek:null,offset:0,maxHit:false,today:null,dayType:"A",checks:{},completed:false};
let infoOpen={};

async function load(){
  let raw=null;
  if(typeof window!=="undefined" && window.storage){ try{ const r=await window.storage.get(KEY); if(r&&r.value) raw=r.value; }catch(e){} }
  if(raw===null){ try{ raw=localStorage.getItem(KEY); }catch(e){} }
  if(raw){ try{ Object.assign(state, JSON.parse(raw)); }catch(e){} }
}
async function save(){
  const s=JSON.stringify(state);
  if(typeof window!=="undefined" && window.storage){ try{ await window.storage.set(KEY,s); return; }catch(e){} }
  try{ localStorage.setItem(KEY,s); }catch(e){}
}

function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayStr(){ return isoDate(new Date()); }
function parseISO(s){ const p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function dayDiff(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function weekBucket(s){ return Math.floor(parseISO(s).getTime()/86400000/7); }

function autoLevel(){ return Math.min(MAX, 1+Math.floor(state.total/5)); }
function levelIdx(){ return Math.max(1, Math.min(MAX, autoLevel()+state.offset)) - 1; }
function jokerAvail(){ return state.jokerWeek !== weekBucket(state.today||todayStr()); }
function otherType(){ return state.dayType==="A"?"B":"A"; }
function typeName(t){ return t==="A"?DAY_A.name:DAY_B.name; }

function unlockedIds(){
  return ACH.filter(a=>{
    if(a.kind==="total") return state.total>=a.n;
    if(a.kind==="streak") return state.best>=a.n;
    if(a.kind==="max") return state.maxHit;
    return false;
  }).map(a=>a.id);
}

function freshen(){
  const t=todayStr();
  if(state.today!==t){
    if(state.last){
      const diff=dayDiff(state.last,t);
      const alive = diff<=1 || (diff===2 && (weekBucket(t)!==state.jokerWeek));
      if(!alive) state.streak=0;
    }
    state.today=t; state.checks={}; state.completed=false;
    state.dayType = (state.total%2===0) ? "A" : "B";
  }
}

function complete(){
  if(state.completed) return;
  const before=unlockedIds();
  const wk=weekBucket(state.today);
  if(!state.last){ state.streak=1; }
  else{
    const diff=dayDiff(state.last,state.today);
    if(diff<=0){}
    else if(diff===1){ state.streak+=1; }
    else if(diff===2 && jokerAvail()){ state.streak+=1; state.jokerWeek=wk; }
    else{ state.streak=1; }
  }
  state.best=Math.max(state.best,state.streak);
  state.last=state.today;
  state.total+=1;
  state.completed=true;
  if(levelIdx()+1>=MAX) state.maxHit=true;
  const gained=unlockedIds().filter(id=>!before.includes(id));
  save(); render(gained);
}

function render(gained){
  gained=gained||[];
  const li=levelIdx(), items=circuit(li,state.dayType);

  document.getElementById("v-streak").textContent=state.streak;
  document.getElementById("t-streak").classList.toggle("cold", state.streak===0);
  document.getElementById("v-level").innerHTML=(li+1)+"<small>/6</small>";
  document.getElementById("v-total").textContent=state.total;

  const al=autoLevel(), into=state.total%5, toNext=5-into;
  const prog=document.getElementById("prog");
  const hint='<div class="hint">Opbouw gaat via moeilijkere varianten en tempo — niet enkel meer herhalingen. Op niveau 6 blijft het gelijk.</div>';
  if(al>=MAX){
    prog.innerHTML='<div class="row"><b>Niveau 6 — onderhoudsmodus</b><span>plafond</span></div><div class="track"><div class="fill" style="width:100%"></div></div>'+hint;
  }else{
    prog.innerHTML='<div class="row"><b>Nog '+toNext+' sessie'+(toNext===1?'':'s')+' tot niveau '+(al+1)+'</b><span>'+into+'/5</span></div><div class="track"><div class="fill" style="width:'+(into/5*100)+'%"></div></div>'+hint;
  }

  const ja=jokerAvail();
  document.getElementById("joker").innerHTML='<span class="jdot '+(ja?'on':'off')+'"></span>Joker deze week: '+(ja?'beschikbaar — één gemiste dag breekt je reeks niet':'gebruikt');

  const t=document.getElementById("tonight");
  let head='<div class="th"><div class="lab">Vanavond · niveau '+(li+1)+' <span class="daytag">'+state.dayType+'-dag</span></div>'+
    '<div class="lvl">'+typeName(state.dayType)+'</div>'+
    '<div class="nx">Wisselt af — morgen: '+typeName(otherType())+'</div></div>';
  let cele='';
  if(state.completed){
    let g='';
    if(gained.length){ g='<div class="gained">'+gained.map(id=>{const a=ACH.find(x=>x.id===id);return '<span>'+a.em+' '+a.name+'</span>';}).join('')+'</div>'; }
    cele='<div class="celebrate"><div class="big">Voltooid vanavond ✓</div><div class="sm">Reeks: '+state.streak+' · totaal: '+state.total+' sessies</div>'+g+'</div>';
  }
  const rows=items.map((ex,j)=>{
    const on=!!state.checks[j], hasInfo=!!INFO[ex.n], iOpen=!!infoOpen[j], lock=state.completed;
    return '<div class="ex'+(on?" done":"")+'">'+
      '<div class="cb'+(on?" on":"")+(lock?" lock":"")+'"'+(lock?'':' data-j="'+j+'" role="checkbox" tabindex="0"')+'><svg viewBox="0 0 24 24"><path d="M4 12 l5 5 l11 -12"/></svg></div>'+
      '<div class="ex-txt">'+
        '<div class="ex-head"'+(hasInfo?' data-info="'+j+'"':'')+'>'+
          '<span class="ex-name">'+ex.n+'<span class="rep">'+ex.r+'</span></span>'+
          (hasInfo?'<button class="i'+(iOpen?' open':'')+'">i</button>':'')+
        '</div>'+
        (ex.note?'<div class="ex-note">'+ex.note+'</div>':'')+
        (ex.easy?'<div class="ex-easy">makkelijker: '+ex.easy+'</div>':'')+
        (hasInfo&&iOpen?'<div class="ex-info">'+INFO[ex.n]+'</div>':'')+
      '</div>'+
    '</div>';
  }).join('');
  const ctl='<div class="lvlctl"><button data-off="-1">te zwaar — makkelijker</button><button data-off="1">te makkelijk — pittiger</button></div>';
  t.className="tonight"+(state.completed?" done":"");
  t.innerHTML=head+cele+'<div class="exlist">'+rows+'</div>'+ctl;

  const un=unlockedIds();
  document.getElementById("badges").innerHTML=ACH.map(a=>{
    const u=un.includes(a.id);
    return '<div class="badge '+(u?'un':'lk')+'"><span class="em">'+a.em+'</span><div><div class="bt">'+a.name+'</div><div class="bs">'+(u?a.sub:'nog vergrendeld')+'</div></div></div>';
  }).join('');

  bind();
}

function bind(){
  document.querySelectorAll(".cb[data-j]").forEach(c=>{
    const toggle=()=>{ const j=c.dataset.j; state.checks[j]=!state.checks[j]; if(!state.checks[j]) delete state.checks[j];
      const items=circuit(levelIdx(),state.dayType); const all=items.every((_,k)=>state.checks[k]);
      if(all){ complete(); } else { save(); render(); } };
    c.onclick=toggle;
    c.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle();} };
  });
  document.querySelectorAll(".ex-head[data-info]").forEach(h=>{
    h.onclick=()=>{ const j=h.dataset.info; infoOpen[j]=!infoOpen[j]; render(); };
  });
  document.querySelectorAll(".lvlctl button").forEach(b=>{
    b.onclick=()=>{ const d=+b.dataset.off; const next=Math.max(1,Math.min(MAX, levelIdx()+1 + d));
      state.offset = next - autoLevel(); infoOpen={}; save(); render(); };
  });
}

document.getElementById("reset").onclick=()=>{
  if(confirm("Alles wissen: sessies, reeks en achievements?")){
    state={total:0,streak:0,best:0,last:null,jokerWeek:null,offset:0,maxHit:false,today:todayStr(),dayType:"A",checks:{},completed:false};
    infoOpen={}; save(); render();
  }
};

(async()=>{ await load(); freshen(); await save(); render(); })();
</script>
