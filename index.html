<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCDO FIT</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MCDO FIT">
<meta name="theme-color" content="#0A0A0B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="logo">mcdo<i></i>fit</div>
      <div class="tagline">Bodyweight trainer</div>
    </div>
    <div class="hbtns">
      <button class="iconbtn" data-act="themeflip" aria-label="Licht of donker"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
      <button class="iconbtn fab" id="fab" data-act="tab" data-tab="set" aria-label="Instellingen"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.6"/><circle cx="10" cy="17" r="2.6"/></svg></button>
    </div>
  </header>

  <nav class="tabs">
    <button data-act="tab" data-tab="today">Vandaag</button>
    <button data-act="tab" data-tab="cal">Kalender</button>
  </nav>

  <main>
    <section class="page" id="p-today"></section>
    <section class="page" id="p-cal"></section>
    <section class="page" id="p-set"></section>
  </main>
</div>

<div class="ov" id="sheet" hidden></div>
<div class="ov" id="guided" hidden></div>

<script src="js/data.js"></script>
<script src="js/logic.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
