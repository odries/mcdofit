<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCDO FIT</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MCDO FIT">
<meta name="theme-color" content="#2F6D5B">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{
    --mist:#E7ECEC; --paper:#F4F6F5; --card:#FBFCFC; --ink:#16241F; --stone:#5F726F;
    --line:#D3DBD9; --spruce:#2F6D5B; --spruce-soft:#DCEAE4; --amber:#D98A2B; --amber-soft:#F6E6CE;
    --shadow:0 1px 2px rgba(22,36,31,.06),0 6px 16px rgba(22,36,31,.05);
  }
  body.dark{
    --mist:#0F1A16; --paper:#17251F; --card:#1B2A24; --ink:#E7ECEA; --stone:#93A39E;
    --line:#2C3B35; --spruce:#4E9C83; --spruce-soft:#24463B; --amber:#E7A34A; --amber-soft:#3A2E1C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--mist);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;padding:calc(18px + env(safe-area-inset-top)) 14px 60px;transition:background .2s,color .2s}
  .wrap{max-width:560px;margin:0 auto}

  header{display:flex;align-items:center;gap:11px;margin:2px 2px 16px}
  .peak{flex:0 0 auto}
  .eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--stone)}
  h1{font-size:22px;line-height:1.1;margin:2px 0 0;letter-spacing:-.01em}
  .theme{margin-left:auto;flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 12px;box-shadow:var(--shadow);text-align:center}
  .tile .v{font-family:ui-monospace,Menlo,monospace;font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .tile .v small{font-size:13px;color:var(--stone)}
  .tile .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--stone);margin-top:6px}
  .tile.streak .v{color:var(--amber)}
  .tile.streak.cold .v{color:var(--stone)}

  .week{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 12px 10px;box-shadow:var(--shadow);margin-bottom:10px}
  .week .wt{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 11px}
  .week .wt b{font-size:13px}
  .week .wt span{font-size:12px;color:var(--stone);font-family:ui-monospace,Menlo,monospace}
  .cells{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .cell .cl{font-size:10px;color:var(--stone);text-transform:uppercase;letter-spacing:.03em}
  .cell .dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;font-family:ui-monospace,Menlo,monospace;color:var(--stone);background:var(--paper);transition:.12s}
  .cell.done .dot{background:var(--spruce);border-color:var(--spruce);color:#fff}
  .cell.rest .dot{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
  .cell.today .dot{border-color:var(--spruce)}
  .cell.today.done .dot{color:#fff}
  .cell.miss .dot{border-style:dashed}
  .cell.future{opacity:.38}
  .cell.tap .dot{cursor:pointer}
  .cell.tap .dot:active{transform:scale(.92)}
  .wlegend{display:flex;flex-wrap:wrap;gap:12px;margin:11px 2px 0;font-size:11px;color:var(--stone)}
  .wlegend span{display:inline-flex;align-items:center;gap:5px}
  .ld{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .wh{font-size:11.5px;color:var(--stone);margin:9px 2px 0}

  .progress{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:20px}
  .progress .row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--stone);margin-bottom:8px}
  .progress .row b{color:var(--ink);font-size:13px}
  .track{height:8px;background:var(--mist);border-radius:6px;overflow:hidden}
  .fill{height:100%;background:var(--spruce);border-radius:6px;transition:width .3s}
  .hint{font-size:11.5px;color:var(--stone);margin-top:9px}

  .tonight{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
  .tonight.done{border-color:var(--spruce);box-shadow:0 0 0 2px var(--spruce-soft),var(--shadow)}
  .th{padding:15px 16px 4px}
  .th .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);display:flex;align-items:center;gap:8px}
  .daytag{background:var(--spruce-soft);color:var(--spruce);border-radius:6px;padding:1px 6px;font-weight:700;letter-spacing:.05em}
  .th .lvl{font-size:18px;font-weight:600;margin-top:3px}
  .th .nx{font-size:12px;color:var(--stone);margin-top:2px}
  .restbanner{margin:12px 16px 0;padding:10px 12px;border-radius:10px;background:var(--amber-soft);color:var(--ink);font-size:12.5px}
  .celebrate{margin:14px 16px;padding:14px;border-radius:12px;background:var(--spruce-soft);text-align:center}
  .celebrate .big{font-size:16px;font-weight:700;color:var(--spruce)}
  .celebrate .sm{font-size:13px;color:var(--ink);margin-top:4px}
  .gained{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .gained span{font-size:12px;background:var(--card);border:1px solid var(--spruce);color:var(--spruce);border-radius:20px;padding:2px 9px;font-weight:600}

  .exlist{padding:4px 16px 8px}
  .ex{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
  .ex:first-child{border-top:none}
  .cb{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;margin-top:1px;transition:.12s}
  .cb.on{background:var(--spruce);border-color:var(--spruce)}
  .cb svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
  .cb.on svg{opacity:1}
  .cb.lock{opacity:.7;cursor:default}
  .ex-txt{flex:1 1 auto;min-width:0}
  .ex-head{display:flex;align-items:center;gap:8px;cursor:pointer}
  .ex-name{font-size:15px;font-weight:600;flex:1 1 auto;min-width:0}
  .ex-name .rep{font-family:ui-monospace,Menlo,monospace;color:var(--spruce);font-weight:700;margin-left:4px}
  .ex.done .ex-name{text-decoration:line-through;text-decoration-color:var(--stone);color:var(--stone)}
  .cell .dot svg{display:block}
  .timerbtn{flex:0 0 auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;color:var(--spruce);background:var(--spruce-soft);border:none;border-radius:20px;padding:3px 10px;cursor:pointer;min-width:52px;text-align:center}
  .timerbtn.run{background:var(--amber-soft);color:var(--amber)}
  .timerbtn.fin{background:var(--spruce);color:#fff}
  .i{flex:0 0 auto;width:19px;height:19px;border-radius:50%;border:1.5px solid var(--stone);color:var(--stone);background:none;font-size:11px;font-style:italic;font-weight:700;font-family:Georgia,serif;cursor:pointer;display:grid;place-items:center;padding:0;margin-left:2px}
  .i.open{background:var(--stone);color:var(--card)}
  .ex.optional{opacity:.85}
  .optchip{font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--stone);background:var(--mist);border:1px solid var(--line);border-radius:20px;padding:1px 7px;flex:0 0 auto}
  .ex-easy{font-size:12px;color:var(--amber);margin-top:2px}
  .starchip{font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--amber);background:var(--amber-soft);border-radius:20px;padding:1px 7px;flex:0 0 auto}
  .ex-note{font-size:12.5px;color:var(--stone);margin-top:1px}
  .ex-info{font-size:12.5px;line-height:1.5;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:8px}

  .lvlctl{display:flex;gap:8px;padding:2px 16px 16px}
  .lvlctl button{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12.5px;color:var(--stone);cursor:pointer}
  .lvlctl button:active{background:var(--mist)}

  .ach h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);margin:22px 2px 10px}
  .badges{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .badge{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
  .badge.lk{opacity:.5}
  .badge .em{font-size:20px;flex:0 0 auto;filter:grayscale(1)}
  .badge.un .em{filter:none}
  .badge .bt{font-size:13px;font-weight:600;line-height:1.2}
  .badge .bs{font-size:11px;color:var(--stone);margin-top:1px}

  footer{text-align:center;color:var(--stone);font-size:12px;margin-top:24px;line-height:1.6}
  .reset{background:none;border:none;color:var(--stone);font-size:12px;text-decoration:underline;cursor:pointer;margin-top:8px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <img class="peak" src="icon.png" width="34" height="34" alt="" style="border-radius:8px;display:block">
    <div>
      <div class="eyebrow">Elke avond · ~10 min</div>
      <h1>MCDO FIT</h1>
    </div>
    <button class="theme" id="theme" aria-label="thema wisselen">☾</button>
  </header>

  <div class="stats">
    <div class="tile streak" id="t-streak"><div class="v" id="v-streak">0</div><div class="k">reeks</div></div>
    <div class="tile"><div class="v" id="v-level">1<small>/6</small></div><div class="k">niveau</div></div>
    <div class="tile"><div class="v" id="v-total">0</div><div class="k">sessies</div></div>
  </div>

  <div class="week" id="week"></div>
  <div class="progress" id="prog"></div>

  <div id="tonight"></div>

  <div class="ach">
    <h2>Achievements</h2>
    <div class="badges" id="badges"></div>
  </div>

  <footer>
    Normale spiervermoeidheid hoort erbij. Scherpe pijn = stoppen.<br>
    <button class="reset" id="reset">alles resetten</button>
  </footer>
</div>

   De "ster" (object met pool) rouleert per dag, dus zelfs dezelfde dag varieert. */
const OPEN={pool:["catcow","wgs","hipopener","shoulderroll"],daily:true};
const DAYS=[
  {tag:"A",name:"Onderlijf & billen",seq:[OPEN,{pool:["squat","lunge","wallsit"]},"glute","calf","deadbug","birddog",{opt:"kickback"},"childs"]},
  {tag:"B",name:"Bovenlijf & core",seq:[OPEN,"push",{pool:["plank","sideplank","deadbug"]},"birddog","glute","calf",{opt:"superman"},"childs"]},
  {tag:"C",name:"Core & rug",seq:[OPEN,"birddog","superman",{pool:["deadbug","sideplank","plank"]},"wallsit","glute",{opt:"kickback"},"hipflexor"]},
  {tag:"D",name:"Full mix",seq:[OPEN,{pool:["squat","lunge","wallsit"]},"push","kickback","calf","plank",{opt:"sideplank"},"hamstring"]},
];
function resolveDay(day){
  const cyc=Math.floor(total()/DAYS.length), tot=total();
  return day.seq.map(s=>{
    if(typeof s==="string") return {key:s,opt:false};
    if(s.opt) return {key:s.opt,opt:true};
    if(s.daily) return {key:s.pool[tot % s.pool.length],opt:false};
    return {key:s.pool[cyc % s.pool.length],opt:false};
  });
}
function circuit(li,di){ return resolveDay(DAYS[di]).map(o=>({ex:EX[o.key][li],opt:o.opt})); }
const DAYICON={
  A:'<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4 L6 16"/><path d="M10 4 L14 16"/><path d="M6 16 H4"/><path d="M14 16 H16"/></svg>',
  B:'<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10 H15"/><path d="M5 7 V13"/><path d="M15 7 V13"/><path d="M3 8.5 V11.5"/><path d="M17 8.5 V11.5"/></svg>',
  C:'<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 C13 5 13 8 10 10 C7 12 7 15 10 17"/></svg>',
  D:'<svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor" stroke="none"><circle cx="7" cy="7" r="1.8"/><circle cx="13" cy="7" r="1.8"/><circle cx="7" cy="13" r="1.8"/><circle cx="13" cy="13" r="1.8"/></svg>',
};

const ACH=[
  {id:"s1",kind:"total",n:1,em:"🌱",name:"Van start",sub:"1e sessie"},
  {id:"s7",kind:"total",n:7,em:"📅",name:"Eerste week rond",sub:"7 sessies"},
  {id:"s21",kind:"total",n:21,em:"💪",name:"Drie weken",sub:"21 sessies"},
  {id:"s50",kind:"total",n:50,em:"🏅",name:"Vaste waarde",sub:"50 sessies"},
  {id:"s100",kind:"total",n:100,em:"🏆",name:"Honderd",sub:"100 sessies"},
  {id:"k3",kind:"streak",n:3,em:"🔥",name:"Op dreef",sub:"3 op rij"},
  {id:"k7",kind:"streak",n:7,em:"🔥",name:"Week op rij",sub:"7 op rij"},
  {id:"k14",kind:"streak",n:14,em:"🔥",name:"Twee weken strak",sub:"14 op rij"},
  {id:"k30",kind:"streak",n:30,em:"⚡",name:"IJzeren discipline",sub:"30 op rij"},
  {id:"lvl",kind:"max",n:6,em:"⛰️",name:"Onderhoudsmodus",sub:"niveau 6 bereikt"},
];

const KEY="mcdofit:v1";
let state={log:{},rest:{},best:0,offset:0,maxHit:false,today:null,dayIdx:0,checks:{},dark:undefined};
let infoOpen={};
let running={};
function clearTimers(){ for(const k in running){ clearInterval(running[k]); } running={}; }

async function load(){
  let raw=null;
  if(typeof window!=="undefined" && window.storage){ try{ const r=await window.storage.get(KEY); if(r&&r.value) raw=r.value; }catch(e){} }
  if(raw===null){ try{ raw=localStorage.getItem(KEY); }catch(e){} }
  if(raw){ try{ Object.assign(state, JSON.parse(raw)); }catch(e){} }
  if(!state.log) state.log={}; if(!state.rest) state.rest={};
  if(typeof state.dayIdx!=="number") state.dayIdx=0;
  if(state.dark===undefined){ try{ state.dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; }catch(e){ state.dark=false; } }
}
async function save(){
  const s=JSON.stringify(state);
  if(typeof window!=="undefined" && window.storage){ try{ await window.storage.set(KEY,s); return; }catch(e){} }
  try{ localStorage.setItem(KEY,s); }catch(e){}
}

function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayStr(){ const d=new Date(); d.setHours(d.getHours()-4); return isoDate(d); } // dag wisselt pas om 04:00
function parseISO(s){ const p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return isoDate(d); }
function mondayOf(s){ const d=parseISO(s); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); return isoDate(d); }
function weekKey(s){ return mondayOf(s); }
function restCountInWeek(s){ const wk=weekKey(s); return Object.keys(state.rest).filter(x=>weekKey(x)===wk).length; }

function total(){ return Object.keys(state.log).length; }
const LVLREQ=[0,5,10,20,30,40];
function autoLevel(){ let l=1; for(let i=0;i<LVLREQ.length;i++){ if(total()>=LVLREQ[i]) l=i+1; } return Math.min(MAX,l); }
function levelIdx(){ return Math.max(1, Math.min(MAX, autoLevel()+state.offset)) - 1; }
function nextIdx(){ return (state.dayIdx+1)%DAYS.length; }

function computeStreak(){
  let cur=todayStr(), count=0, used={}, first=true, guard=0;
  while(guard++<4000){
    if(state.log[cur]){ count++; }
    else if(state.rest[cur]){ const wk=weekKey(cur); if(used[wk]) break; used[wk]=true; }
    else { if(!first) break; }
    first=false; cur=addDays(cur,-1);
  }
  return count;
}

function unlockedIds(){
  const tot=total(), best=state.best;
  return ACH.filter(a=>{
    if(a.kind==="total") return tot>=a.n;
    if(a.kind==="streak") return best>=a.n;
    if(a.kind==="max") return state.maxHit;
    return false;
  }).map(a=>a.id);
}

function freshen(){
  const t=todayStr();
  if(state.today!==t){ state.today=t; state.checks={}; state.dayIdx=total()%DAYS.length; }
  state.best=Math.max(state.best||0, computeStreak());
}

function complete(){
  const t=todayStr();
  if(state.log[t]) return;
  const before=unlockedIds();
  if(state.rest[t]) delete state.rest[t];
  state.log[t]=DAYS[state.dayIdx].tag;
  state.best=Math.max(state.best, computeStreak());
  if(levelIdx()+1>=MAX) state.maxHit=true;
  const gained=unlockedIds().filter(id=>!before.includes(id));
  save(); render(gained);
}

function toggleRest(d){
  if(state.log[d]) return;
  if(d>todayStr()) return;
  if(state.rest[d]){ delete state.rest[d]; }
  else{ if(restCountInWeek(d)>=1) return; state.rest[d]=true; }
  state.best=Math.max(state.best, computeStreak());
  save(); render();
}

function applyTheme(){
  document.body.classList.toggle("dark", !!state.dark);
  const tc=document.querySelector('meta[name=theme-color]'); if(tc) tc.content=state.dark?"#0F1A16":"#2F6D5B";
  const b=document.getElementById("theme"); if(b) b.textContent=state.dark?"☀":"☾";
}

function render(gained){
  gained=gained||[];
  clearTimers();
  const li=levelIdx(), di=state.dayIdx, day=DAYS[di], items=circuit(li,di), t=todayStr(), doneToday=!!state.log[t], streak=computeStreak();

  document.getElementById("v-streak").textContent=streak;
  document.getElementById("t-streak").classList.toggle("cold", streak===0);
  document.getElementById("v-level").innerHTML=(li+1)+"<small>/6</small>";
  document.getElementById("v-total").textContent=total();

  const mon=mondayOf(t), labels=["ma","di","wo","do","vr","za","zo"];
  let doneThisWeek=0, cells="";
  for(let i=0;i<7;i++){
    const d=addDays(mon,i), isToday=(d===t), isFuture=(d>t), done=!!state.log[d], rest=!!state.rest[d];
    if(done) doneThisWeek++;
    let cls="cell", inner="";
    if(done){ cls+=" done"; inner=DAYICON[state.log[d]]||state.log[d]; }
    else if(rest){ cls+=" rest"; inner="●"; }
    else if(isFuture){ cls+=" future"; }
    else { cls+=" miss"; }
    if(isToday) cls+=" today";
    const tappable=!done && !isFuture;
    if(tappable) cls+=" tap";
    cells+='<div class="'+cls+'"><span class="cl">'+labels[i]+'</span><div class="dot"'+(tappable?' data-rest="'+d+'"':'')+'>'+inner+'</div></div>';
  }
  const jokerLeft=restCountInWeek(t)<1;
  document.getElementById("week").innerHTML=
    '<div class="wt"><b>Deze week</b><span>'+doneThisWeek+'/7</span></div>'+
    '<div class="cells">'+cells+'</div>'+
    '<div class="wlegend"><span><span class="ld" style="background:var(--spruce)"></span>gedaan</span>'+
      '<span><span class="ld" style="background:var(--amber)"></span>joker / rust</span>'+
      '<span><span class="ld" style="background:transparent;border:2px dashed var(--line)"></span>gemist</span></div>'+
    '<div class="wh">'+(jokerLeft
        ? 'Tik een gemiste dag (of vandaag) aan om je <b>joker</b> in te zetten — die beschermt je reeks. Eén per week.'
        : 'Joker van deze week is ingezet. Tik hem opnieuw aan om te annuleren.')+'</div>';

  const al=autoLevel(), bandStart=LVLREQ[al-1], bandEnd=(al<MAX?LVLREQ[al]:bandStart), toNext=bandEnd-total(), bandLen=Math.max(1,bandEnd-bandStart);
  const hint='<div class="hint">Opbouw via moeilijkere varianten en tempo — niet enkel meer herhalingen. Vanaf niveau 3 duurt elk niveau langer; op niveau 6 blijft het gelijk.</div>';
  document.getElementById("prog").innerHTML = (al>=MAX
    ? '<div class="row"><b>Niveau 6 — onderhoudsmodus</b><span>plafond</span></div><div class="track"><div class="fill" style="width:100%"></div></div>'+hint
    : '<div class="row"><b>Nog '+toNext+' sessie'+(toNext===1?'':'s')+' tot niveau '+(al+1)+'</b><span>'+(total()-bandStart)+'/'+bandLen+'</span></div><div class="track"><div class="fill" style="width:'+((total()-bandStart)/bandLen*100)+'%"></div></div>'+hint);

  const tn=document.getElementById("tonight");
  let head='<div class="th"><div class="lab">Vanavond · niveau '+(li+1)+'</div><div class="lvl">'+day.name+'</div><div class="nx">Morgen: '+DAYS[nextIdx()].name+'</div></div>';
  let banner="";
  if(!doneToday && state.rest[t]) banner='<div class="restbanner">Rustdag ingezet — je reeks blijft beschermd. Toch zin? Vink gewoon af, dan telt het als sessie.</div>';
  let cele="";
  if(doneToday){
    let g=""; if(gained.length){ g='<div class="gained">'+gained.map(id=>{const a=ACH.find(x=>x.id===id);return '<span>'+a.em+' '+a.name+'</span>';}).join('')+'</div>'; }
    cele='<div class="celebrate"><div class="big">Voltooid vanavond ✓</div><div class="sm">Reeks: '+streak+' · totaal: '+total()+' sessies</div>'+g+'</div>';
  }
  const rows=items.map((it,j)=>{
    const ex=it.ex, on=!!state.checks[j], hasInfo=!!INFO[ex.n], iOpen=!!infoOpen[j], lock=doneToday;
    const tm=(!lock)?ex.r.match(/(\d+)\s*sec/):null; const tsec=tm?+tm[1]:0;
    return '<div class="ex'+(on?" done":"")+(it.opt?" optional":"")+'">'+
      '<div class="cb'+(on?" on":"")+(lock?" lock":"")+'"'+(lock?'':' data-j="'+j+'" role="checkbox" tabindex="0"')+'><svg viewBox="0 0 24 24"><path d="M4 12 l5 5 l11 -12"/></svg></div>'+
      '<div class="ex-txt"><div class="ex-head"'+(hasInfo?' data-info="'+j+'"':'')+'>'+
        '<span class="ex-name">'+ex.n+'<span class="rep">'+ex.r+'</span></span>'+
        (it.opt?'<span class="optchip">optioneel</span>':'')+
        (tsec?'<button class="timerbtn" data-t="'+j+'" data-sec="'+tsec+'">▶ '+tsec+'s</button>':'')+
        (hasInfo?'<button class="i'+(iOpen?' open':'')+'">i</button>':'')+
      '</div>'+
      (ex.note?'<div class="ex-note">'+ex.note+'</div>':'')+
      (ex.easy?'<div class="ex-easy">makkelijker: '+ex.easy+'</div>':'')+
      (hasInfo&&iOpen?'<div class="ex-info">'+INFO[ex.n]+'</div>':'')+
      '</div></div>';
  }).join('');
  const ctl='<div class="lvlctl"><button data-off="-1">te zwaar — makkelijker</button><button data-off="1">te makkelijk — pittiger</button></div>';
  tn.className="tonight"+(doneToday?" done":"");
  tn.innerHTML=head+banner+cele+'<div class="exlist">'+rows+'</div>'+ctl;

  const un=unlockedIds();
  document.getElementById("badges").innerHTML=ACH.map(a=>{
    const u=un.includes(a.id);
    return '<div class="badge '+(u?'un':'lk')+'"><span class="em">'+a.em+'</span><div><div class="bt">'+a.name+'</div><div class="bs">'+(u?a.sub:'nog vergrendeld')+'</div></div></div>';
  }).join('');

  bind();
}

function bind(){
  document.querySelectorAll(".dot[data-rest]").forEach(el=>{ el.onclick=()=>toggleRest(el.dataset.rest); });
  document.querySelectorAll(".cb[data-j]").forEach(c=>{
    const toggle=()=>{ const j=c.dataset.j; state.checks[j]=!state.checks[j]; if(!state.checks[j]) delete state.checks[j];
      const items=circuit(levelIdx(),state.dayIdx); const all=items.every((it,k)=> it.opt || state.checks[k]);
      if(all){ complete(); } else { save(); render(); } };
    c.onclick=toggle; c.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle();} };
  });
  document.querySelectorAll(".timerbtn").forEach(b=>{
    b.onclick=(e)=>{ e.stopPropagation();
      const j=b.dataset.t, sec=+b.dataset.sec;
      if(running[j]){ clearInterval(running[j]); delete running[j]; b.classList.remove("run","fin"); b.textContent="▶ "+sec+"s"; return; }
      let rem=sec; b.classList.remove("fin"); b.classList.add("run"); b.textContent=rem+"s";
      running[j]=setInterval(()=>{
        rem--;
        if(rem<=0){ clearInterval(running[j]); delete running[j]; b.classList.remove("run"); b.classList.add("fin"); b.textContent="klaar ✓";
          try{ navigator.vibrate && navigator.vibrate(200); }catch(e){}
          setTimeout(()=>{ b.classList.remove("fin"); b.textContent="▶ "+sec+"s"; },1600);
        } else { b.textContent=rem+"s"; }
      },1000);
    };
  });
  document.querySelectorAll(".ex-head[data-info]").forEach(h=>{ h.onclick=()=>{ const j=h.dataset.info; infoOpen[j]=!infoOpen[j]; render(); }; });
  document.querySelectorAll(".lvlctl button").forEach(b=>{ b.onclick=()=>{ const d=+b.dataset.off; const next=Math.max(1,Math.min(MAX, levelIdx()+1 + d)); state.offset=next-autoLevel(); infoOpen={}; save(); render(); }; });
}

document.getElementById("theme").onclick=()=>{ state.dark=!state.dark; save(); applyTheme(); };
document.getElementById("reset").onclick=()=>{
  if(confirm("Alles wissen: sessies, reeks, jokers en achievements?")){
    const dark=state.dark;
    state={log:{},rest:{},best:0,offset:0,maxHit:false,today:todayStr(),dayIdx:0,checks:{},dark:dark};
    infoOpen={}; save(); render();
  }
};

(async()=>{ await load(); freshen(); applyTheme(); await save(); render(); })();
</script>
